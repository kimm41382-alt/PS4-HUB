<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10182a"><title>PS4 Game Hub</title><link rel="stylesheet" href="styles.css"></head>
<body><header><h1>PS4 Game Hub</h1><p id="status" role="status" aria-live="polite">Loading games…</p><button id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings">RPI Settings</button></header>
<main><section class="controls" aria-label="Game catalogue controls"><label>Search <input id="search" type="search" placeholder="Title, ID, region, version or genre" autocomplete="off"></label><label>Region <select id="region"><option value="">All regions</option></select></label><label>Sort <select id="sort"><option value="title">Title</option><option value="size">Size</option><option value="version">Version</option></select></label><label class="check"><input id="ps4-mode" type="checkbox"> PS4 Mode</label></section>
<section id="settings" hidden aria-label="Remote Package Installer settings"><label>Installer IP / host <input id="rpi-host" inputmode="numeric" placeholder="192.168.1.10"></label><label>Timeout (ms) <input id="rpi-timeout" type="number" min="500" max="15000" value="1500"></label><label>Retries <input id="rpi-retries" type="number" min="0" max="3" value="1"></label><div><button id="save-rpi" type="button">Save IP</button><button id="forget-rpi" type="button">Forget IP</button><button id="test-rpi" type="button">Test Connection</button><button id="detect-rpi" type="button">Auto Detect</button><button id="clear-cache" type="button">Clear Cache</button></div></section>
<section id="catalogue" aria-live="polite"><div id="game-grid" class="game-grid"></div><button id="load-more" type="button" hidden>Load more games</button></section></main><noscript>This application requires JavaScript to load the game catalogue.</noscript>
<script src="src/shared/package-validator.js"></script><script src="src/games/games-validator.js"></script><script src="src/games/games-normalizer.js"></script><script src="src/games/games-cache.js"></script><script src="src/games/games-loader.js"></script><script src="src/image-resolver.js"></script><script src="src/rpi/rpi-config.js"></script><script src="src/rpi/rpi-errors.js"></script><script src="src/rpi/rpi-endpoints.js"></script><script src="src/rpi/rpi-client.js"></script><script src="src/rpi/rpi-detector.js"></script><script src="src/rpi/rpi-install.js"></script><script src="src/app.js"></script></body></html>
